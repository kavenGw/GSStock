  rating: watch
  watch_reason: '以 2026-08-19 收盘 US$128.90（市值 US$300.84bn / 2,334M ADS）为主锚，场景加权期望内在价值 US$110.63 / ADS， 安全边际 −14.2%，即当前价高于我的期望内在价值，没有任何折价可言。观察而非排除的理由有三： (1) 生意本体没坏——电商集团经调整 EBITA 同比仅 −1%（RMB 39,749M），AI 云收入与外部客户收入双双 +45%、分部 EBITA +133%、margin 升至 11.6%， 经营现金流仍 +11%，账上净现金 US$30.83bn（每 ADS US$13.21，占现价 10.2%）； (2) 利润塌陷的归因高度集中且技术上可逆——集团经调整 EBITA 同比减少 RMB 115.15 亿，其中 106.37 亿（92.4%）来自 AI Labs 一个分部 （另有 All others 恶化 40.30 亿即 35%，被 AI 云 +32.09 亿的改善部分抵销），含闪购在内的电商基本盘仅 −2.39 亿（−1%）， 这是一笔管理层可自主关停的新投入，不是核心业务失血； (3) 但价格不认这些好消息还不够——真实 TTM PE 30.3×（第三方广泛引用的 20.20× 窗口截至 2026-03-31、不含本季，已失效）， 隐含 ROE 仅 6.69%（Non-GAAP 4.56%），TTM 自由现金流 −US$10.74bn，本季 capex : 回购 = 62 : 1， 基本加权股本反而同比 +0.54%（RSU 归属已超回购，股东在被稀释）。 按剩余收益模型反推，现价 PB 1.93× 隐含市场要求可持续 ROE 18.4%（或永续增长 15.6%）， 两者都要求利润回到并超越历史峰值——这是"用周期顶利润定价"的典型形态，而阿里连续 4 季 EPS miss、本季 Non-GAAP EPS MISS 约 29%。 另有两项使确定性降档：折旧洪峰刚开始（折旧及土地租赁成本 RMB 118.14 亿 vs 去年 68.91 亿，而 TTM capex 已达 RMB 1,550.65 亿）， 以及同一季三次口径调整（补贴改记收入冲减、闪购并入大分部、AliExpress 盈利只给形容词）净效果一致指向关键经营变量不可外部验证——诚信黄灯，非红灯。 评级为 watch 而非 config：不是因为公司不好，而是因为在 US$128.90 上买不到 buffett 要求的折价。买点 US$66 / ADS。'
